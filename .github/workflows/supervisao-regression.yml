name: Supervisao Regression Foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Test, targeted lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8 --no-audit --no-fund

      - name: Verify npm
        run: test "$(npm --version)" = "10.9.8"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Lint regression foundation
        run: ./node_modules/.bin/eslint tests/supervisao/format.test.js tests/supervisao/dashboardUtils.test.js tests/supervisao/backend-summary-static.test.js tests/supervisao/lancamento-summary-static.test.js tests/supervisao/card-indicador-static.test.js

      - name: Build
        run: npm run build
